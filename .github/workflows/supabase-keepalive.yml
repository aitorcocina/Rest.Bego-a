name: Supabase Keep-Alive

on:
  schedule:
    # Lunes y jueves a las 8:00 UTC
    - cron: '0 8 * * 1,4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping a Supabase (begona-appcc)
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://ozksefsaivqwrzcbmmto.supabase.co/rest/v1/begona_kv?select=key&limit=1" \
            -H "apikey: sb_publishable_inkklEU7tvm-bXOOsuPPMQ_y93a90JK" \
            -H "Authorization: Bearer sb_publishable_inkklEU7tvm-bXOOsuPPMQ_y93a90JK" || true)
          echo "Respuesta de Supabase: $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::Supabase no ha respondido 200 (respuesta: $codigo)"
            exit 1
          fi

      - name: Registrar actividad (evita que GitHub desactive el cron a los 60 dias)
        run: |
          mkdir -p .github
          echo "Ultimo ping: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/keep-alive-log.txt
          git config user.name "keep-alive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/keep-alive-log.txt
          git diff --staged --quiet || git commit -m "chore: keep-alive ping $(date -u +'%Y-%m-%d')"
          git push
