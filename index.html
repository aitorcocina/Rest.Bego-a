<style>
  :root{
    --cream:#FBF7F1; --card:#FFFFFF; --ink:#3E3A34; --muted:#8B8579; --border:#EAE3D5;
    --peach:#F2C4A6;    --peach-light:#FBEBDE;
    --butter:#EFD98C;   --butter-light:#FBF3D8;
    --sky:#A7C6DC;      --sky-light:#E7F1F7;
    --sage:#9BBB93;     --sage-light:#E4EFDE;
    --rose:#DCA3AA;     --rose-light:#F7E7E9;
    --lavender:#C6B4D8; --lavender-light:#EEE6F3;
    --clay:#D6A276;     --clay-light:#F5E9DB;
    --mint:#8FC3AE;     --mint-light:#E1F0E9;
    --coral:#E3A9A0;    --coral-light:#F8E6E2;
    --good:#8FB89A; --warn:#E0A96D; --bad:#D68585;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream); color:var(--ink); font-family:'Inter',sans-serif; -webkit-tap-highlight-color:transparent; padding-bottom:40px;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0;}

  .app-shell{max-width:1000px; margin:0 auto;}

  header.top{padding:26px 18px 16px; text-align:center;}
  header.top .eyebrow{font-size:30px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink); font-weight:700; font-family:'Fraunces',serif; line-height:1.15;}
  header.top h1{font-size:22px; color:var(--muted); font-weight:500;}
  header.top .sub{font-size:13px; color:var(--muted); margin-top:4px;}

  .app-switch{display:flex; gap:8px; padding:0 16px 16px; max-width:560px; margin:0 auto;}
  .app-switch button{
    flex:1; border:none; border-radius:12px; padding:10px 8px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; color:var(--ink);
    background:var(--card); border:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .app-switch button .ic{font-size:16px;}
  .app-switch button.active.appcc{background:var(--sage); border-color:transparent;}
  .app-switch button.active.horario{background:var(--sky); border-color:transparent;}
  .app-switch button.active.escandallos{background:var(--mint); border-color:transparent;}
  .app-switch button.active.recetas{background:var(--butter); border-color:transparent;}
  .app-switch button.active.facturas{background:var(--rose); border-color:transparent;}

  /* Facturas */
  .fac-empresa-card{background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden;}
  .fac-empresa-head{display:flex; align-items:center; justify-content:space-between; padding:13px 14px; cursor:pointer; gap:8px;}
  .fac-empresa-head .nombre{font-weight:700; font-size:14.5px; flex:1;}
  .fac-empresa-head .count{font-size:11.5px; color:var(--muted); background:var(--rose-light); border-radius:999px; padding:3px 9px; font-weight:700; white-space:nowrap;}
  .fac-lista{display:none; padding:0 14px 12px;}
  .fac-lista.open{display:block;}
  .fac-item{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px dashed var(--border);}
  .fac-item .ic{font-size:18px; flex:0 0 auto;}
  .fac-item .info{flex:1; min-width:0;}
  .fac-item .fecha{font-weight:700; font-size:13px;}
  .fac-item .importe{font-size:12px; color:var(--muted);}
  .fac-item .acciones{display:flex; gap:6px; flex:0 0 auto;}
  .fac-mini-btn{border:none; background:var(--sky-light); color:#2c5570; border-radius:8px; padding:6px 9px; font-size:12px; cursor:pointer; font-weight:600;}
  .fac-month-count{background:var(--rose-light); color:#8A4650; border-radius:12px; padding:10px 14px; text-align:center; font-weight:700; margin-bottom:12px;}

  /* Portada / Inicio */
  header.top .eyebrow{ cursor:pointer; }
  .hero{
    position:relative; min-height:100svh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; overflow:hidden;
    padding:32px 24px;
  }

  .hero .veil{
    position:absolute; inset:0; z-index:1;
    background:linear-gradient(180deg, rgba(251,247,241,.55) 0%, rgba(251,247,241,.30) 35%, rgba(251,247,241,.55) 68%, rgba(251,247,241,.98) 100%);
  }
  .hero .content{ position:relative; z-index:2; max-width:640px; }
  .hero .eyebrow{
    font-family:'Fraunces',serif; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--ink); font-size:44px; line-height:1.12;
    text-shadow:0 2px 18px rgba(251,247,241,.9), 0 1px 0 rgba(251,247,241,.6);
  }
  .hero .subtitulo{
    margin-top:14px; font-family:'Fraunces',serif; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:#5a5044; font-size:26px;
  }
  .hero .divider{
    width:46px; height:3px; border-radius:3px; margin:24px auto 0;
    background:linear-gradient(90deg, var(--peach), var(--rose));
  }
  .app-switch-hero{ position:relative; z-index:2; display:flex; gap:8px; margin-top:34px; flex-wrap:wrap; justify-content:center; max-width:560px;}
  .app-switch-hero button{
    border:1px solid var(--border); background:var(--card); color:var(--ink);
    padding:10px 16px; border-radius:12px; font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    display:flex; align-items:center; gap:6px; cursor:pointer; box-shadow:0 1px 2px rgba(62,58,52,.06);
  }
  @media(max-width:700px){
    .hero{ justify-content:flex-start; padding-top:13vh; }
    .hero .subtitulo{ margin-top:30px; }
  }
  @media(max-width:420px){
    .hero .eyebrow{ font-size:34px; }
  }

  .plato-card .plato-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .plato-name{font-weight:700; font-size:16px;}
  .ing-row{display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:6px; margin-bottom:6px; align-items:center;}
  .ing-row input{font-size:12.5px; padding:6px 7px;}
  .ing-head{display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:6px; font-size:10px; color:var(--muted); text-transform:uppercase; font-weight:700; margin-bottom:4px;}
  .plato-summary{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
  .summary-chip{background:var(--mint-light); color:#2d5c48; border-radius:10px; padding:8px 12px; font-size:12px; flex:1; min-width:110px; text-align:center;}
  .summary-chip .big{font-family:'Fraunces',serif; font-weight:700; font-size:18px; display:block;}
  .summary-chip.warn{background:var(--rose-light); color:#8A4650;}
  .import-panel{background:var(--mint-light); border-radius:14px; padding:14px; margin-bottom:14px;}
  .import-map-row{display:grid; grid-template-columns:1fr 1.4fr; gap:8px; align-items:center; margin-bottom:8px;}
  .import-map-row label{font-size:12.5px; font-weight:600;}

  nav.tabs{display:flex; overflow-x:auto; gap:8px; padding:6px 16px 14px; scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto; border:1px solid var(--border); background:var(--card); color:var(--ink);
    padding:9px 14px; border-radius:999px; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600;
    display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap;
  }
  nav.tabs button.active{ border-color:transparent; }
  nav.tabs button:active{ transform:scale(.96); }

  main{padding:4px 16px 30px;}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin:18px 0 10px;}
  .section-head h2{font-size:19px;}
  .section-head .accent-bar{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:8px;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(62,58,52,.04);}

  .btn{border:none; border-radius:12px; padding:10px 16px; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  .btn:active{transform:scale(.97);}
  .btn-add{background:var(--ink); color:#FFF9EF;}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .btn-sm{padding:6px 10px; font-size:12.5px; border-radius:9px;}
  .btn-danger{background:var(--rose-light); color:#8A4650;}
  .btn-del{background:var(--rose-light); color:#8A4650; border:none; width:34px;height:34px;border-radius:10px; font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer;}

  input[type=text], input[type=date], input[type=number], input[type=tel], select{
    font-family:'Inter',sans-serif; border:1px solid var(--border); background:#FFFDF9; border-radius:9px;
    padding:8px 10px; font-size:14px; color:var(--ink); width:100%;
  }
  input:focus, select:focus{outline:2px solid var(--sky); outline-offset:1px;}
  label.field-label{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:3px;}

  .row-grid{display:grid; gap:8px; margin-bottom:8px; align-items:end;}
  .empty-hint{text-align:center; color:var(--muted); font-size:13.5px; padding:22px 10px; border:1.5px dashed var(--border); border-radius:14px;}

  /* Month nav (compartido) */
  .month-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px;}
  .month-nav button{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-weight:600; cursor:pointer; flex:0 0 auto;}
  .month-nav .label{text-align:center;}
  .month-nav .label h2{font-size:19px;}

  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--border); border-radius:14px;}
  table.cal{width:100%; border-collapse:collapse; font-size:12.5px; background:var(--card);}
  table.cal th{background:var(--sky-light); color:#2c5570; font-weight:700; padding:7px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.02em; white-space:nowrap; position:sticky; top:0;}
  table.cal td{padding:5px 3px; text-align:center; border-bottom:1px solid var(--border);}
  table.cal input, table.cal select{width:100%; min-width:58px; padding:5px 3px; font-size:12px; text-align:center; border:1px solid var(--border); border-radius:6px;}
  table.cal select{min-width:66px;}
  table.cal td.dia{font-weight:700; min-width:30px;}
  table.cal td.total{font-weight:700; background:var(--peach-light); border-radius:6px;}

  /* Limpieza */
  .limpieza-cat{margin-bottom:22px;}
  .item-row{background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:8px; overflow:hidden;}
  .item-head{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; cursor:pointer;}
  .item-head .left{display:flex; flex-direction:column; gap:2px;}
  .item-head .name{font-weight:700; font-size:14.5px;}
  .item-head .freq{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .item-head .chev{color:var(--muted); font-size:12px;}
  .months{display:none; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 14px 14px;}
  .months.open{display:grid;}
  .month-chip{display:flex; align-items:center; gap:6px; font-size:12.5px; background:var(--sage-light); border-radius:8px; padding:6px 8px; cursor:pointer; user-select:none;}
  .month-chip.done{background:var(--good); color:#fff; font-weight:600;}
  .month-chip input{display:none;}

function timeOptions(){
  const arr = [''];
  for(let h=0; h<24; h++){ for(let m=0; m<60; m+=15){ arr.push(pad2(h)+':'+pad2(m)); } }
  return arr;
}
const TIME_OPTIONS = timeOptions();
function timeSelect(value, onchange){
  return `<select onchange="${onchange}">${TIME_OPTIONS.map(t=>`<option value="${t}" ${t===(value||'')?'selected':''}>${t===''?'-':t}</option>`).join('')}</select>`;
}

/* ================= Supabase (guardado en la nube) ================= */
const SUPABASE_URL = 'https://ozksefsaivqwrzcbmmto.supabase.co';
const SUPABASE_KEY = 'sb_publishable_inkklEU7tvm-bXOOsuPPMQ_y93a90JK';
const SB_TABLE = 'begona_kv';
let cloudStatus = 'conectando'; // conectando | ok | error

function sbHeaders(extra){
  return Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json' }, extra||{});
}
async function sbSet(key, value){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?on_conflict=key`, {
      method:'POST',
      headers: sbHeaders({ Prefer:'resolution=merge-duplicates' }),
      body: JSON.stringify([{ key:key, value:value }])
    });
    cloudStatus = res.ok ? 'ok' : 'error';
  }catch(e){ cloudStatus = 'error'; }
  renderCloudBadge();
}
async function sbGetAll(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?select=key,value`, { headers: sbHeaders() });
  if(!res.ok) throw new Error('No se pudo leer de Supabase');
  return res.json();
}
function renderCloudBadge(){
  const el = document.getElementById('cloudBadge');
  if(!el) return;
  const map = { conectando:['⏳','Conectando...','var(--muted)'], ok:['☁️','Guardado en la nube','#3d5c37'], error:['⚠️','Sin conexión, guardado solo en este dispositivo','#8A4650'] };
  const [ic,txt,color] = map[cloudStatus];
  el.innerHTML = `<span style="color:${color}">${ic} ${txt}</span>`;
}

function getLocalValue(key){
  const map = {
    appcc_temps: appcc.temps, appcc_diario: appcc.diario, appcc_camaras: appcc.camaras,
    appcc_limpieza: appcc.limpieza, appcc_anual: appcc.anual, appcc_manip: appcc.manip, appcc_prov: appcc.prov,
    horario_empleados: empleados, horario_turnos: turnos, recetas: recetas, facturas: facturas,
  };
  return map[key];
}
function applyCloudValue(key, value){
  if(key==='appcc_temps') appcc.temps = value;
  else if(key==='appcc_diario') appcc.diario = value;
  else if(key==='appcc_camaras') appcc.camaras = value;
  else if(key==='appcc_limpieza') appcc.limpieza = value;
  else if(key==='appcc_anual') appcc.anual = value;
  else if(key==='appcc_manip') appcc.manip = value;
  else if(key==='appcc_prov') appcc.prov = value;
  else if(key==='horario_empleados') empleados = value;
  else if(key==='horario_turnos') turnos = value;
  else if(key==='recetas') recetas = value;
  else if(key==='facturas') facturas = value;
  DB.set(key, value);
}
function isNonEmptyValue(v){
  if(v==null) return false;
  if(Array.isArray(v)) return v.length>0;
  if(typeof v==='object') return Object.keys(v).length>0;
  return !!v;
}
async function initCloudSync(){
  const allKeys = ['appcc_temps','appcc_diario','appcc_camaras','appcc_limpieza','appcc_anual','appcc_manip','appcc_prov','horario_empleados','horario_turnos','recetas','facturas'];
  // Estas tres secciones las gestionan tareas automáticas en Supabase (cron). Ningún dispositivo
  // debe poder "sembrar" ni sobrescribir su contenido inicial nunca: solo se leen, jamás se empujan.
  const soloLectura = new Set(['appcc_temps','appcc_diario','appcc_camaras']);
  try{
    const rows = await sbGetAll();
    const cloudMap = {};
    rows.forEach(r => cloudMap[r.key] = r.value);
    allKeys.forEach(k => {
      if(cloudMap[k] !== undefined && cloudMap[k] !== null){
        applyCloudValue(k, cloudMap[k]);
      } else if(!soloLectura.has(k) && isNonEmptyValue(getLocalValue(k))){
        // Solo empujamos hacia la nube si este dispositivo tiene datos reales que aportar,
        // y nunca para las secciones gestionadas por cron.
        sbSet(k, getLocalValue(k));
      }
    });
    cloudStatus = 'ok';
  }catch(e){
    cloudStatus = 'error';
  }
  cloudSyncDone = true;
  renderCloudBadge();
  renderAll();
}

      <div class="label"><h2>${MESES[calMonth]} ${calYear}</h2></div>

    </div>
  `;
}
function shiftCalMonth(delta){
  calMonth += delta;
  if(calMonth<0){ calMonth=11; calYear--; }
  if(calMonth>11){ calMonth=0; calYear++; }
  renderAll();
}
function ensureCalMonth(section, factory){
  const key = monthKey(calYear, calMonth);
  if(!appcc[section][key]){
    const n = daysInMonth(calYear, calMonth);
    appcc[section][key] = Array.from({length:n}, (_,i)=>factory(i+1));
    // Estas tres secciones las crea/rellena el cron en Supabase; el navegador nunca sube este
    // "hueco" recién creado, solo lo guarda localmente para poder mostrarlo mientras tanto.
    DB.set('appcc_'+section, appcc[section]);
  }
  return appcc[section][key];
}
function updCalCell(section, rowId, field, value, isNumber){
  const key = monthKey(calYear, calMonth);
  const rows = appcc[section][key];
  const r = rows.find(x=>x.id===rowId);
  if(!r) return;
  r[field] = isNumber ? (value===''?null:parseFloat(value)) : value;
  persistAppcc(section); renderAll();
}

function updManipField(id, field, value){ const p = appcc.manip.find(x=>x.id===id); p[field]=value; persistAppcc('manip'); }
async function uploadPdf(id, input){
  const file = input.files[0]; if(!file) return;
  const p = appcc.manip.find(x=>x.id===id);
  p.pdfUploading = true; renderAll();
  const path = `${id}_${Date.now()}_${encodeURIComponent(file.name)}`;
  try{
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/carnets/${path}`, {
      method:'POST',
      headers: sbHeaders({ 'Content-Type': file.type || 'application/pdf' }),
      body: file
    });
    if(!res.ok) throw new Error('Fallo al subir: '+res.status);
    p.pdfUrl = `${SUPABASE_URL}/storage/v1/object/public/carnets/${path}`;
    p.pdfName = file.name;
  }catch(e){
    alert('No se ha podido subir el PDF. Comprueba que el bucket "carnets" existe, es público, y que has ejecutado las políticas SQL indicadas.');
  }
  p.pdfUploading = false;
  persistAppcc('manip'); renderAll();
}
function addManip(){ appcc.manip.push({id:uid(), nombre:'Nuevo empleado', pdfUrl:null, pdfName:null}); persistAppcc('manip'); renderAll(); }
function verPdf(url, nombre){
  document.getElementById('pdfModalTitle').textContent = nombre;
  document.getElementById('pdfModalFrame').src = url;
  document.getElementById('pdfModal').style.display = 'flex';
}
function cerrarPdf(){
  document.getElementById('pdfModal').style.display = 'none';
  document.getElementById('pdfModalFrame').src = '';
}

function persistRecetas(){ DB.set('recetas', recetas); sbSet('recetas', recetas); }

let recetaAbierta = null;
let recetaEditando = null;
let recetaFiltro = '';

function renderRecetas(){
  const filtro = recetaFiltro.trim().toLowerCase();
  const lista = recetas
    .filter(r => !filtro || r.nombre.toLowerCase().includes(filtro))
    .slice()
    .sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));

  return `
    <div class="card" style="background:var(--butter-light); border:none;">
      <div style="font-size:13px; color:#6b5620;">Recetario del restaurante. Toca una receta para verla, editarla o enviarla.</div>
    </div>
    <div class="toolbar receta-search">
      <input type="text" placeholder="Buscar receta..." value="${recetaFiltro}" oninput="recetaFiltro=this.value; renderAll();" style="flex:1;">
      <button class="btn btn-add" onclick="addReceta()">+ Nueva receta</button>
    </div>
    ${lista.length===0 ? `<div class="empty-hint">No se ha encontrado ninguna receta.</div>` : ''}
    ${lista.map(r => renderRecetaItem(r)).join('')}
  `;
}

function renderRecetaItem(r){
  const abierta = recetaAbierta === r.id;
  const editando = recetaEditando === r.id;
  const nombreBonito = r.nombre.charAt(0).toUpperCase() + r.nombre.slice(1).toLowerCase();
  return `
    <div class="receta-item ${abierta?'open':''}" id="receta-${r.id}">
      <div class="receta-head" onclick="toggleReceta('${r.id}')">
        <span class="ic-bubble">🍽️</span>
        <span class="nombre">${nombreBonito}</span>
        <span class="chev">${abierta ? '▲' : '▼'}</span>
      </div>
      ${abierta ? `
        <div class="receta-body">
          ${editando ? `
            <div class="receta-edit">
              <input type="text" id="edit-nombre-${r.id}" value="${r.nombre}">
              <textarea id="edit-contenido-${r.id}" style="min-height:160px;">${r.contenido}</textarea>
            </div>
            <div class="receta-toolbar">
              <button class="btn btn-add btn-sm" onclick="guardarReceta('${r.id}')">💾 Guardar</button>
              <button class="btn btn-ghost btn-sm" onclick="recetaEditando=null; renderAll();">Cancelar</button>
            </div>
          ` : `
            <div class="receta-contenido">${r.contenido || '(sin contenido todavía)'}</div>
            <div class="receta-toolbar">
              <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); recetaEditando='${r.id}'; renderAll();">✏️ Editar</button>
              <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); enviarReceta('${r.id}')">📤 Enviar / Imprimir</button>
              <button class="btn-del" onclick="event.stopPropagation(); delReceta('${r.id}')">🗑</button>
            </div>
          `}
        </div>
      ` : ''}
    </div>
  `;
}

function toggleReceta(id){
  recetaAbierta = (recetaAbierta === id) ? null : id;
  recetaEditando = null;
  renderAll();
}
function addReceta(){
  const nueva = {id:uid(), nombre:'NUEVA RECETA', contenido:''};
  recetas.push(nueva);
  persistRecetas();
  recetaFiltro = '';
  recetaAbierta = nueva.id;
  recetaEditando = nueva.id;
  renderAll();
  setTimeout(() => {
    const el = document.getElementById('receta-'+nueva.id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 50);
}
function guardarReceta(id){
  const r = recetas.find(x=>x.id===id);
  const nombreEl = document.getElementById('edit-nombre-'+id);
  const contenidoEl = document.getElementById('edit-contenido-'+id);
  r.nombre = (nombreEl.value || 'SIN NOMBRE').trim().toUpperCase();
  r.contenido = contenidoEl.value;
  persistRecetas();
  recetaEditando = null;
  renderAll();
}
function delReceta(id){
  recetas = recetas.filter(r=>r.id!==id);
  persistRecetas();
  if(recetaAbierta===id) recetaAbierta = null;
  renderAll();
}
async function enviarReceta(id){
  const r = recetas.find(x=>x.id===id);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('Restaurante Begoña — Recetario', 14, y); y += 10;
  doc.setFontSize(17);
  doc.text(r.nombre, 14, y); y += 10;
  doc.setDrawColor(200); doc.line(14, y, 196, y); y += 8;
  doc.setFont('helvetica','normal'); doc.setFontSize(11.5);
  const lineas = doc.splitTextToSize(r.contenido || '(sin contenido)', 180);
  lineas.forEach(linea => {
    if(y > 280){ doc.addPage(); y = 20; }
    doc.text(linea, 14, y);
    y += 6.5;
  });

  const nombreArchivo = `receta_${r.nombre.replace(/\s+/g,'_').toLowerCase()}.pdf`;
  const blob = doc.output('blob');

  // Móvil: abre directamente el panel de compartir (WhatsApp, email, imprimir...) sin descargar nada.
  if(navigator.canShare){
    try{
      const file = new File([blob], nombreArchivo, {type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:r.nombre});
        return;
      }
    }catch(e){ /* si cancela el share, no hacemos nada más */ return; }
  }

  // Escritorio (sin Web Share): abre el PDF en una pestaña nueva para poder imprimirlo o guardarlo desde ahí, sin forzar descarga.
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

const FACTURAS_BUCKET = 'facturas';
const FACTURAS_TABS = [
  {id:'anadir',   label:'Añadir',              icon:'➕', color:'rose'},
  {id:'empresas', label:'Por empresa',         icon:'🏢', color:'clay'},
  {id:'meses',    label:'Por mes / Imprimir',  icon:'🖨️', color:'sky'},
];
let facturas = DB.get('facturas', []);
let activeFacturasTab = 'anadir';
let facYear = new Date().getFullYear();
let facMonth = new Date().getMonth();
let facEmpresaAbierta = null;
let facBusqueda = '';
let facSubiendo = false;
let facImprimiendo = false;
let facNuevaEmpresa = '';
let facNuevaFecha = '';
let facNuevoImporte = '';

function persistFacturas(){ DB.set('facturas', facturas); sbSet('facturas', facturas); }

function normaliza(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function empresasUnicas(){
  const set = new Set();
  facturas.forEach(f => { if(f.empresa) set.add(f.empresa); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'es'));
}

function iconoFactura(f){ return (f.archivoTipo||'').includes('pdf') ? '📄' : '🖼️'; }

function fmtImporte(n){
  if(n===null || n===undefined || isNaN(n)) return '';
  return Number(n).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
}

function facturasDelMes(y,m){
  return facturas.filter(f=>{
    if(!f.fecha) return false;
    const [fy,fm] = f.fecha.split('-').map(Number);
    return fy===y && fm===(m+1);
  }).sort((a,b)=> a.fecha.localeCompare(b.fecha));
}

async function subirFactura(input){
  const file = input.files[0];
  if(!file) return;
  const empresa = (facNuevaEmpresa||'').trim();
  const fecha = facNuevaFecha;
  if(!empresa){ alert('Escribe primero el nombre de la empresa.'); input.value=''; return; }
  if(!fecha){ alert('Elige primero la fecha de la factura.'); input.value=''; return; }
  facSubiendo = true; renderAll();
  const id = uid();
  const path = `${id}_${Date.now()}_${encodeURIComponent(file.name)}`;
  try{
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${FACTURAS_BUCKET}/${path}`, {
      method:'POST',
      headers: sbHeaders({ 'Content-Type': file.type || 'application/octet-stream' }),
      body: file
    });
    if(!res.ok) throw new Error('Fallo al subir: '+res.status);
    facturas.push({
      id, empresa, fecha,
      importe: facNuevoImporte!=='' ? parseFloat(facNuevoImporte) : null,
      archivoUrl: `${SUPABASE_URL}/storage/v1/object/public/${FACTURAS_BUCKET}/${path}`,
      archivoName: file.name, archivoTipo: file.type || '', creado: Date.now()
    });
    persistFacturas();
    facNuevaEmpresa=''; facNuevaFecha=''; facNuevoImporte='';
  }catch(e){
    alert('No se ha podido subir la factura. Comprueba que el bucket "facturas" existe en Supabase, es público, y que has ejecutado las políticas SQL indicadas.');
  }
  facSubiendo = false;
  renderAll();
}

function delFactura(id){
  if(!confirm('¿Borrar esta factura? No se puede deshacer.')) return;
  facturas = facturas.filter(f=>f.id!==id);
  persistFacturas(); renderAll();
}

function cambiarFacMonth(delta){
  facMonth += delta;
  if(facMonth<0){ facMonth=11; facYear--; }
  if(facMonth>11){ facMonth=0; facYear++; }
  renderAll();
}

  return `
    ${sectionHead('Por mes / Imprimir','rose')}
    <div class="month-nav">
      <button onclick="cambiarFacMonth(-1)">←</button>
      <div class="label"><h2>${MESES[facMonth]} ${facYear}</h2></div>
      <button onclick="cambiarFacMonth(1)">→</button>
    </div>
    <div class="fac-month-count">${items.length} factura${items.length===1?'':'s'} en ${MESES[facMonth].toLowerCase()}</div>
    ${items.length>0 ? `<div style="margin-bottom:14px;"><button class="btn btn-add" onclick="imprimirFacturasMes()" ${facImprimiendo?'disabled':''}>${facImprimiendo?'Generando PDF...':'🖨️ Imprimir todas ('+items.length+')'}</button></div>` : ''}
    ${items.length===0 ? `<div class="empty-hint">No hay facturas guardadas de este mes.</div>` : ''}
    ${items.map(f=>`
      <div class="card" style="display:flex; align-items:center; gap:10px;">
        <span class="ic" style="font-size:20px;">${iconoFactura(f)}</span>
        <div style="flex:1;">
          <div style="font-weight:700; font-size:14px;">${f.empresa}</div>
          <div style="font-size:12px; color:var(--muted);">${f.fecha}${f.importe?' · '+fmtImporte(f.importe):''}</div>
        </div>
        <button class="fac-mini-btn" onclick="verPdf('${f.archivoUrl}','${(f.archivoName||'Factura').replace(/'/g,"\\'")}')">👁️ Ver</button>
      </div>
    `).join('')}
  `;
}

async function imprimirFacturasMes(){
  const items = facturasDelMes(facYear, facMonth);
  if(items.length===0) return;
  facImprimiendo = true; renderAll();
  try{
    const { PDFDocument } = PDFLib;
    const merged = await PDFDocument.create();
    for(const f of items){
      const res = await fetch(f.archivoUrl);
      if(!res.ok) continue;
      const bytes = await res.arrayBuffer();
      const esPdf = (f.archivoTipo||'').includes('pdf') || (f.archivoName||'').toLowerCase().endsWith('.pdf');
      if(esPdf){
        const src = await PDFDocument.load(bytes, {ignoreEncryption:true});
        const pages = await merged.copyPages(src, src.getPageIndices());
        pages.forEach(p=>merged.addPage(p));
      } else {
        let img;
        try{ img = await merged.embedJpg(bytes); }catch(e){ img = await merged.embedPng(bytes); }
        const page = merged.addPage([img.width, img.height]);
        page.drawImage(img, {x:0, y:0, width:img.width, height:img.height});
      }
    }
    const pdfBytes = await merged.save();
    const blob = new Blob([pdfBytes], {type:'application/pdf'});
    const nombreArchivo = `Facturas_${MESES[facMonth]}_${facYear}.pdf`;

    if(navigator.canShare){
      try{
        const file = new File([blob], nombreArchivo, {type:'application/pdf'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:nombreArchivo});
          facImprimiendo = false; renderAll();
          return;
        }
      }catch(e){ facImprimiendo = false; renderAll(); return; }
    }
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }catch(e){
    alert('No se ha podido generar el PDF combinado. Revisa tu conexión e inténtalo de nuevo.');
  }
  facImprimiendo = false; renderAll();
}

function renderFacturas(){
  if(activeFacturasTab==='anadir') return renderFacturasAnadir();
  if(activeFacturasTab==='empresas') return renderFacturasEmpresas();
  return renderFacturasMeses();
}

/* ================= HORARIO state ================= */
let empleados = DB.get('horario_empleados', [
  {id:uid(), nombre:'Martin Uribarri'},
  {id:uid(), nombre:'Nekane Santamaria'},
  {id:uid(), nombre:'Aitor Martinez'},
  {id:uid(), nombre:'Ricard Espinosa'},
  {id:uid(), nombre:'Xabier Uribarri'},
]);
let turnos = DB.get('horario_turnos', {});
let horYear = new Date().getFullYear();
let horMonth = new Date().getMonth();
let horExpanded = {};
let pendingDeleteEmpId = null;
let shareOpenFor = null;
let nuevoEmpNombre = '';

function persistEmpleados(){ DB.set('horario_empleados', empleados); sbSet('horario_empleados', empleados); }
function persistTurnos(){ DB.set('horario_turnos', turnos); sbSet('horario_turnos', turnos); }

function getMonthRows(empId, y, m){
  const key = monthKey(y,m);
  if(!turnos[empId]) turnos[empId] = {};
  if(!turnos[empId][key]){
    const n = daysInMonth(y,m);
    turnos[empId][key] = Array.from({length:n}, (_,i)=>({id:uid(), dia:i+1, entM:'',salM:'',horasM:'',entN:'',salN:'',horasN:''}));
    if(cloudSyncDone){ persistTurnos(); } else { DB.set('horario_turnos', turnos); }
  }
  return turnos[empId][key];
}
function rowTotal(r){ return (parseFloat(r.horasM)||0) + (parseFloat(r.horasN)||0); }
function monthTotal(rows){ return rows.reduce((s,r)=>s+rowTotal(r),0); }

function renderHorarioTable(empId){
  const rows = getMonthRows(empId, horYear, horMonth);
  const total = monthTotal(rows);
  return `
    <div class="total-card">
      <div class="lbl">Total del mes</div>
      <div class="num">${total.toFixed(1)}</div>
      <div class="unit">horas trabajadas</div>
      <button class="pdf-btn" onclick="exportPDFFor('${empId}')">📄 Exportar PDF</button>
    </div>
    <div class="table-wrap">
      <table class="cal">
        <thead><tr><th>Día</th><th>Ent.M</th><th>Sal.M</th><th>Hs.M</th><th>Ent.N</th><th>Sal.N</th><th>Hs.N</th><th>Total</th></tr></thead>
        <tbody>
        ${rows.map(r => `
          <tr>
            <td class="dia">${r.dia}</td>
            <td>${timeSelect(r.entM, `updCell('${empId}','${r.id}','entM',this.value)`)}</td>
            <td>${timeSelect(r.salM, `updCell('${empId}','${r.id}','salM',this.value)`)}</td>
            <td><input type="number" step="0.5" value="${r.horasM||''}" placeholder="0" onchange="updCell('${empId}','${r.id}','horasM',this.value)"></td>
            <td>${timeSelect(r.entN, `updCell('${empId}','${r.id}','entN',this.value)`)}</td>
            <td>${timeSelect(r.salN, `updCell('${empId}','${r.id}','salN',this.value)`)}</td>
            <td><input type="number" step="0.5" value="${r.horasN||''}" placeholder="0" onchange="updCell('${empId}','${r.id}','horasN',this.value)"></td>
            <td class="total">${rowTotal(r).toFixed(1)}</td>
          </tr>
        `).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function updCell(empId, rowId, field, value){
  const rows = getMonthRows(empId, horYear, horMonth);
  const r = rows.find(x=>x.id===rowId);
  if(!r) return;
  r[field] = value;
  persistTurnos(); renderAll();
}
function shiftHorMonth(delta){
  horMonth += delta;
  if(horMonth<0){ horMonth=11; horYear--; }
  if(horMonth>11){ horMonth=0; horYear++; }
  renderAll();
}
function toggleHorEmp(id){ horExpanded[id] = !horExpanded[id]; shareOpenFor=null; renderAll(); }

function buildEmpLink(id){
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('emp', id);
  url.searchParams.set('modo', 'empleado');
  return url.toString();
}
function toggleShare(id){ shareOpenFor = (shareOpenFor===id) ? null : id; renderAll(); }
function copyShareLink(id){
  const link = buildEmpLink(id);
  const el = document.getElementById('sharelink-'+id);
  if(el){ el.select(); el.setSelectionRange(0, 99999); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).catch(()=>{});
  }
  const btn = document.getElementById('copybtn-'+id);
  if(btn){ btn.textContent = '¡Copiado!'; setTimeout(()=>{ btn.textContent='Copiar enlace'; }, 2000); }
}

function renderHorario(){
  const params = new URLSearchParams(window.location.search);
  const lockId = params.get('emp');
  const isLockMode = params.get('modo')==='empleado' && lockId;

  if(isLockMode){
    const emp = empleados.find(e=>e.id===lockId);
    if(!emp){
      return `<div class="empty-hint">Este enlace no corresponde a ningún empleado guardado en este dispositivo.</div>`;
    }
    return `
      <div class="lock-banner">
        <span>👤 Horario de <strong>${emp.nombre}</strong></span>
        <a href="${window.location.pathname}">Ver panel completo</a>
      </div>
      <div class="month-nav">
        <button onclick="shiftHorMonth(-1)">‹ Anterior</button>
        <div class="label"><h2>${MESES[horMonth]} ${horYear}</h2></div>
        <button onclick="shiftHorMonth(1)">Siguiente ›</button>
      </div>
      ${renderHorarioTable(emp.id)}
    `;
  }

  return `
    <div class="card" style="background:var(--sky-light); border:none;">
      <div style="font-size:13px; color:#2c5570;">Toca un nombre para ver y editar su calendario del mes. Los días del mes ya salen puestos.</div>
    </div>
    <div class="month-nav">
      <button onclick="shiftHorMonth(-1)">‹ Anterior</button>
      <div class="label"><h2>${MESES[horMonth]} ${horYear}</h2></div>
      <button onclick="shiftHorMonth(1)">Siguiente ›</button>
    </div>
    ${empleados.length===0 ? `<div class="empty-hint">No hay empleados todavía. Añade el primero abajo.</div>` : ''}
    ${empleados.map(e => {
      const rows = getMonthRows(e.id, horYear, horMonth);
      const total = monthTotal(rows);
      let flag='flag-ok', flagText='Normal';
      if(total===0){ flag='flag-low'; flagText='Sin horas'; }
      else if(total<60){ flag='flag-low'; flagText='Pocas horas'; }
      else if(total>190){ flag='flag-high'; flagText='Muchas horas'; }
      return `
      <div class="card">
        <div class="admin-emp-card">
          <div class="emp-actions" onclick="toggleHorEmp('${e.id}')">
            <div>
              <input type="text" class="name-input" value="${e.nombre}" onclick="event.stopPropagation()" onchange="renameEmpleado('${e.id}', this.value)">
              <div class="hrs">${total.toFixed(1)} horas este mes</div>
            </div>
          </div>
          <span class="badge-flag ${flag}">${flagText}</span>
        </div>
        ${horExpanded[e.id] ? `
          ${renderHorarioTable(e.id)}
          <div class="emp-toolbar">
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); toggleShare('${e.id}')">📤 Enviar a ${e.nombre.split(' ')[0]}</button>
            <button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); requestDeleteEmpleado('${e.id}')">${pendingDeleteEmpId===e.id ? '⚠️ Toca para confirmar' : '🗑 Eliminar empleado'}</button>
          </div>
          ${shareOpenFor===e.id ? `
            <div class="share-box">
              <label class="field-label">Enlace personal de ${e.nombre}</label>
              <input id="sharelink-${e.id}" type="text" readonly value="${buildEmpLink(e.id)}" onclick="this.select()">
              <button id="copybtn-${e.id}" class="btn btn-add btn-sm" style="margin-top:8px;" onclick="copyShareLink('${e.id}')">Copiar enlace</button>
              <div class="hint">Envíaselo por WhatsApp o donde prefieras. Cuando la web esté publicada en internet (GitHub Pages), este enlace abrirá directamente su horario en el móvil.</div>
            </div>
          ` : ''}
        ` : ''}
      </div>
    `}).join('')}

    <div class="card">
      <label class="field-label">Añadir empleado nuevo</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="nuevoEmpInput" placeholder="Nombre y apellido">
        <button class="btn btn-add" onclick="addEmpleado()">+ Añadir</button>
      </div>
    </div>
  `;
}
function addEmpleado(){
  const inp = document.getElementById('nuevoEmpInput');
  const nombre = inp ? inp.value.trim() : '';
  if(!nombre) return;
  empleados.push({id:uid(), nombre});
  persistEmpleados(); renderAll();
}
function renameEmpleado(id, nuevoNombre){
  const e = empleados.find(x=>x.id===id);
  if(!e || !nuevoNombre.trim()) return;
  e.nombre = nuevoNombre.trim();
  persistEmpleados(); renderAll();
}
function requestDeleteEmpleado(id){
  if(pendingDeleteEmpId===id){
    empleados = empleados.filter(e=>e.id!==id);
    delete turnos[id];
    persistEmpleados(); persistTurnos();
    pendingDeleteEmpId = null;
    renderAll();
  } else {
    pendingDeleteEmpId = id;
    renderAll();
    setTimeout(()=>{ if(pendingDeleteEmpId===id){ pendingDeleteEmpId=null; renderAll(); } }, 4000);
  }
}
function exportPDFFor(empId){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const emp = empleados.find(e=>e.id===empId);
  const rows = getMonthRows(empId, horYear, horMonth);
  const total = monthTotal(rows);

  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Restaurante Begoña — Control Horario', 14, 18);
  doc.setFontSize(12);
  doc.text(`${emp ? emp.nombre : ''}`, 14, 26);
  doc.text(`${MESES[horMonth]} ${horYear}`, 14, 33);
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(`Total del mes: ${total.toFixed(1)} horas`, 14, 41);

  let y = 52;
  doc.setFontSize(9); doc.setFont('helvetica','bold');
  const headers = ['Día','Ent.M','Sal.M','Hs.M','Ent.N','Sal.N','Hs.N','Total'];
  const colX = [14,32,50,68,84,102,120,138];
  headers.forEach((h,i)=>doc.text(h, colX[i], y));
  y+=6;
  doc.setFont('helvetica','normal');
  rows.forEach(r=>{
    if(y>280){ doc.addPage(); y=20; }
    const vals = [r.dia, r.entM||'-', r.salM||'-', r.horasM||'0', r.entN||'-', r.salN||'-', r.horasN||'0', rowTotal(r).toFixed(1)];
    vals.forEach((v,i)=>doc.text(String(v), colX[i], y));
    y+=6;
  });
  doc.save(`horario_${emp?emp.nombre.replace(/\s+/g,'_'):'empleado'}_${MESES[horMonth]}_${horYear}.pdf`);
}

/* ---- Informe completo APPCC en PDF (por departamentos, para inspección de Sanidad) ---- */
function exportAppccPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageH = 290;
  let y = 20;

  function checkPage(needed){
    if(y + needed > pageH){ doc.addPage(); y = 20; }
  }
  function coverTitle(){
    doc.setFont('helvetica','bold'); doc.setFontSize(18);
    doc.text('Restaurante Begoña', 14, y); y+=8;
    doc.setFontSize(13); doc.setFont('helvetica','normal');
    doc.text('Informe de Control APPCC', 14, y); y+=6;
    doc.setFontSize(10); doc.setTextColor(120);
    doc.text('Generado el ' + new Date().toLocaleDateString('es-ES'), 14, y);
    doc.setTextColor(0); y+=12;
  }
  function deptHeader(title){
    checkPage(16);
    doc.setFillColor(235,225,205);
    doc.rect(14, y-5, 182, 9, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(title, 16, y+1);
    y += 12;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  }
  function line(text){
    checkPage(6);
    doc.text(text, 14, y);
    y += 5.5;
  }
  function smallNote(text){
    checkPage(6);
    doc.setTextColor(120); doc.setFontSize(8.5);
    doc.text(text, 14, y);
    doc.setTextColor(0); doc.setFontSize(9.5);
    y += 5.5;
  }

  coverTitle();

  // Temperaturas
  deptHeader(`1. Temperatura de productos recibidos — ${MESES[calMonth]} ${calYear}`);
  const tRows = appcc.temps[monthKey(calYear,calMonth)] || [];
  const tFilled = tRows.filter(r => r.producto || r.temp!=null);
  if(tFilled.length===0){ smallNote('Sin registros este mes.'); }
  tFilled.forEach(r => line(`Día ${r.dia}: ${r.producto||'-'}  |  ${r.temp!=null?r.temp+' °C':'-'}`));
  y += 4;

  // Diario
  deptHeader(`2. Control diario de cocción — ${MESES[calMonth]} ${calYear}`);
  const dRows = appcc.diario[monthKey(calYear,calMonth)] || [];
  const dFilled = dRows.filter(r => r.fritura||r.horneado||r.vapor||r.plancha||r.cambioAceite);
  if(dFilled.length===0){ smallNote('Sin registros este mes.'); }
  dFilled.forEach(r => {
    line(`Día ${r.dia}: Fritura ${r.fritura||'-'} | Horneado ${r.horneado||'-'} | Vapor ${r.vapor||'-'} | Plancha ${r.plancha||'-'}${r.cambioAceite?' | Cambio de aceite ✔':''}`);
  });
  y += 4;

  // Camaras
  deptHeader(`3. Temperatura de cámaras — ${MESES[calMonth]} ${calYear}`);
  const cRows = appcc.camaras[monthKey(calYear,calMonth)] || [];
  const cFilled = cRows.filter(r => [r.c1,r.c2,r.c3,r.c4,r.c5].some(v=>v!=null));
  if(cFilled.length===0){ smallNote('Sin registros este mes.'); }
  cFilled.forEach(r => line(`Día ${r.dia}: C1 ${r.c1??'-'} | C2 ${r.c2??'-'} | C3 ${r.c3??'-'} | C4 ${r.c4??'-'} | C5 ${r.c5??'-'}`));
  y += 4;

  // Limpieza
  deptHeader('4. Control de limpieza');
  [['elementos','Elementos / Utillaje'],['maquinaria','Maquinaria'],['instalaciones','Instalaciones']].forEach(([key,label])=>{
    checkPage(8);
    doc.setFont('helvetica','bold'); doc.text(label, 14, y); y+=5.5;
    doc.setFont('helvetica','normal');
    appcc.limpieza[key].forEach(it => {
      const doneMonths = MESES.filter((m,i)=>it.months[i]).map(m=>m.slice(0,3));
      line(`${it.name}${it.freq?' ('+it.freq+')':''}: ${doneMonths.length ? doneMonths.join(', ') : 'sin marcar'}`);
    });
    y += 3;
  });

  // Anual
  deptHeader('5. Control anual');
  appcc.anual.bloques.forEach(b => {
    checkPage(8);
    doc.setFont('helvetica','bold'); doc.text(b.name, 14, y); y+=5.5;
    doc.setFont('helvetica','normal');
    b.items.forEach(it => line(`- [${it.status==='listo'?'Listo':'En progreso'}] ${it.text}`));
    y += 3;
  });
  checkPage(8);
  doc.setFont('helvetica','bold'); doc.text('Incidencias', 14, y); y+=5.5;
  doc.setFont('helvetica','normal');
  if(appcc.anual.incidencias.length===0){ smallNote('Sin incidencias registradas.'); }
  appcc.anual.incidencias.forEach(inc => line(`${inc.fecha}: ${inc.texto}`));
  y += 4;

  // Manipuladores
  deptHeader('6. Manipuladores de alimentos');
  appcc.manip.forEach(p => line(`${p.nombre}: ${p.pdfUrl ? 'Carnet subido ('+ (p.pdfName||'PDF') +')' : 'Sin carnet subido'}`));
  y += 4;

  // Proveedores
  deptHeader('7. Proveedores');
  appcc.prov.forEach(p => {
    const vehTxt = p.vehiculo==='muybueno'?'Muy bueno':p.vehiculo==='bueno'?'Bueno':'Malo';
    checkPage(12);
    doc.setFont('helvetica','bold'); doc.text(p.nombre, 14, y); y+=5;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    line(`${p.direccion||'-'} | Contacto: ${p.contacto||'-'} | Tel: ${p.telefono||'-'} | Vehículo: ${vehTxt}`);
    if(p.productos.length) line(`Productos: ${p.productos.join(', ')}`);
    doc.setFontSize(9.5);
    y += 2;
  });

  doc.save(`APPCC_Restaurante_Begona_${MESES[calMonth]}_${calYear}.pdf`);
}
function renderExportBar(){
  const bar = document.getElementById('appccExportBar');
  if(currentApp!=='appcc'){ bar.innerHTML=''; return; }
  bar.innerHTML = `<button class="btn btn-add" onclick="exportAppccPDF()">📄 Exportar informe completo (PDF)</button>`;
}

/* ================= Render dispatcher ================= */
function renderTabs(){
  const nav = document.getElementById('tabs');
  if(currentApp==='appcc'){
    nav.innerHTML = APPCC_TABS.map(t => `
      <button data-tab="${t.id}" class="${activeAppccTab===t.id?'active':''}" style="${activeAppccTab===t.id?`background:var(--${t.color});`:''}">
        <span>${t.icon}</span><span>${t.label}</span>
      </button>
    `).join('');
    nav.querySelectorAll('button').forEach(b=>{ b.onclick = () => { activeAppccTab = b.dataset.tab; renderAll(); }; });
  } else if(currentApp==='facturas'){
    nav.innerHTML = FACTURAS_TABS.map(t => `
      <button data-tab="${t.id}" class="${activeFacturasTab===t.id?'active':''}" style="${activeFacturasTab===t.id?`background:var(--${t.color});`:''}">

      </button>
    `).join('');
    nav.querySelectorAll('button').forEach(b=>{ b.onclick = () => { activeFacturasTab = b.dataset.tab; renderAll(); }; });
  } else {
    nav.innerHTML='';
  }
}
function renderAll(){
  renderTabs();
  renderExportBar();
  const main = document.getElementById('main');
  if(currentApp==='appcc'){
    const renderers = { temps:renderTemps, diario:renderDiario, camaras:renderCamaras, limpieza:renderLimpieza, anual:renderAnual, manip:renderManip, prov:renderProv };
    main.innerHTML = renderers[activeAppccTab]();
  } else if(currentApp==='horario'){
    main.innerHTML = renderHorario();
  } else if(currentApp==='recetas'){
    main.innerHTML = renderRecetas();
  } else if(currentApp==='facturas'){
    main.innerHTML = renderFacturas();
  }
}
